[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriagent"
description = "Agentic Verification — AI-powered hardware verification agent (VeriAgent CLI)"
authors = [
    {name = "XS-MLVP", email = "unitychip@bosc.ac.cn"},
]
license = {text = "MIT"}
readme = "README.en.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=1.2.15",
    "langchain_community>=0.3.31",
    "openai>=1.109.1",
    "langgraph>=1.0.5",
    "langchain_openai>=1.1.6",
    "langmem>=0.0.30",
    "mem0ai>=0.1.118",
    "langchain_mcp_adapters>=0.1.11",
    "psutil>=7.1.0",
    "langfuse>=3.9.1",
    "gitpython>=3.1.43",
    "pytoffee@git+https://gitlink.org.cn/XS-MLVP/toffee@master",
    "toffee-test@git+https://gitlink.org.cn/XS-MLVP/toffee-test@master",
    "textual>=7.3.0",
    "Jinja2>=3.1.6",
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "docker>=7.1.0",
    "kubernetes>=33.1.0",
]
dynamic = ["version"]

[project.scripts]
veriagent = "veriagent.cli:main"

[project.urls]
Homepage = "https://github.com/Hui-Ling-Zhen/Agentic-Verification"

[tool.setuptools_scm]
fallback_version = "0.9.1"
version_file = "veriagent/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["veriagent", "veriagent.*"]

[tool.setuptools.package-data]
veriagent = [
    "setting.yaml",
    "assets/*",
    "lang/**/*.yaml",
    "lang/**/*.md",
    "lang/**/*.j2",
    "lang/**/*.json",
    "lang/**/*.toml",
    "lang/**/*.py",
    "tui/**/*.tcss",
]
